name: Strategie-Backtest

on:
  workflow_dispatch:
    inputs:
      script:
        description: Forschungsskript (backtest = Momentum & Co., averaging = Qualität + Nachkauf)
        type: choice
        options: [backtest, averaging]
        default: backtest
      experiments:
        description: Experiment-Datei (leer = Standard des Skripts)
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Kursdaten eine Woche lang wiederverwenden (gleiche Daten für alle Läufe)
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: research-data-${{ inputs.script }}-${{ steps.week.outputs.week }}
          restore-keys: research-data-
      - run: npx tsx "scripts/${{ inputs.script }}.ts" ${{ inputs.experiments }}
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: research/latest.md
